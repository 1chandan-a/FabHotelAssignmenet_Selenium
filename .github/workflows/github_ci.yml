name: GitHub CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: ['17']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven
    
    - name: Display Java version
      run: java -version
    
    - name: Install Maven dependencies
      run: mvn clean install -DskipTests
    
    - name: Run Test Suite
      run: mvn test
      continue-on-error: false
    
    - name: Generate Test Report
      if: always()
      run: |
        echo "Test execution completed"
        ls -la test-output/
        ls -la target/surefire-reports/
    
    - name: Upload Surefire Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: target/surefire-reports/
        retention-days: 30
    
    - name: Upload ExtentReport HTML
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: extent-report-html
        path: test-output/ExtentReport.html
        retention-days: 30
    
    - name: Upload Screenshots (if any)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-screenshots
        path: test-output/screenshots/
        retention-days: 30
    
    - name: Upload PDF Reports (if any)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pdf-reports
        path: test-output/pdf/
        retention-days: 30
    
    - name: Publish Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: target/surefire-reports/TEST-*.xml
        check_name: Test Results Summary
        comment_mode: always
    
    - name: Test Summary
      if: always()
      run: |
        echo "✅ Pipeline Execution Complete"
        echo "📊 Reports Location: Artifacts tab"
        echo "📄 Test Reports: surefire-reports/"
        echo "📊 Extent Report: extent-report-html/ExtentReport.html"

  notify:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    
    steps:
    - name: Pipeline Status
      run: |
        if [ "${{ needs.build-and-test.result }}" == "success" ]; then
          echo "✅ All tests passed!"
        else
          echo "❌ Tests failed. Check artifacts for details."
        fi
